<div class="top-0 end-0 m-2 text-end">
  <div class="btn-group">

    <!-- ➕ ADD -->
    <button *ngIf="!fitness"
            class="btn btn-sm btn-primary m-2"
            (click)="openFitnessModal()"
            ngbTooltip="Add FC Details"
            placement="top">
      <i class="bi bi-plus-lg"></i>
    </button>

    <!-- ✏️ EDIT -->
    <button *ngIf="fitness"
            class="btn btn-sm btn-warning m-2"
            (click)="openFitnessModal(fitness)"
            ngbTooltip="Edit FC Details"
            placement="top">
      <i class="bi bi-pencil"></i>
    </button>

    <!-- 🗑 DELETE -->
    <button *ngIf="fitness"
            class="btn btn-sm btn-danger m-2"
            (click)="openDeleteModal()"
            ngbTooltip="Delete FC Details"
            placement="top">
      <i class="bi bi-trash"></i>
    </button>

  </div>
</div>
<div *ngIf="fitness; else noFitnessData">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <div class="row g-3">


        <div class="col-12 col-md-6">
          <div class="p-3 bg-light rounded h-100">
            <small class="text-muted text-uppercase fw-bold">Issue Date</small>
            <div class="fw-semibold">{{ fitness.issueDate| date:'longDate' }}</div>
         
          </div>
        </div>
                <div class="col-12 col-md-6">
          <div class="p-3 bg-light rounded h-100">
            <small class="text-muted text-uppercase fw-bold">Expiry Date</small>
            <div class="fw-semibold">{{ fitness.expiryDate| date:'longDate' }}</div>
         
          </div>
        </div>


   




   
      
     

      </div>



      <div class="mt-3 text-center">
        <button class="btn btn-outline-primary btn-sm px-4" ngbTooltip="View Scanned FC Document" (click)="viewFCDocument(fitness)">
          <i class="bi bi-file-earmark-pdf"></i> View Scanned FC
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #noFitnessData>
  <div class="p-5 text-center bg-light rounded border border-dashed">
    <i class="bi bi-card-list display-4 text-muted"></i>
    <p class="text-muted mt-2 mb-0">No Fitness records found for this vehicle.</p>
  </div>
</ng-template>
