<div class="card shadow border-0">
  <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Vehicle Information</span>
    <button class="btn btn-outline-light btn-sm" (click)="goBack()" title="Back">
      <i class="bi bi-arrow-left"></i> Back
    </button>
  </div>

  <div class="card-body">
    <div class="row g-4">

      <!-- LEFT SIDE -->
      <div class="col-md-6">

        <!-- Vehicle Number -->
        <div class="mb-4">
          <h4 class="fw-bold mb-0">{{ vehicle?.vehicleNumber }}</h4>
          <small class="text-muted">Registered Vehicle Details</small>
        </div>

        <!-- Info Grid -->
        <div class="row g-3">

          <div class="col-6 col-sm-4 col-md-6" *ngFor="let item of [
      { label: 'Owner Name', value: vehicle?.ownerName },
      { label: 'Vehicle Type', value: vehicle?.vehicleType },
      { label: 'Brand', value: vehicle?.brand },
      { label: 'Color', value: vehicle?.color },
      { label: 'Fuel Type', value: vehicle?.fuelType },
      { label: 'Manufacturing Year', value: vehicle?.manufacturingYear },
      { label: 'Current Km', value: vehicle?.currentKm }
    ]">
            <div class="info-box">
              <div class="info-content">
                <span class="label">{{ item.label }}</span>
                <span class="value">{{ item.value }}</span>
              </div>
            </div>
          </div>

          <!-- Document Section -->
          <div class="col-12">
            <div class="info-box d-flex justify-content-between align-items-center">
              <div>
                <span class="label d-block">Vehicle Document</span>
                <span class="fw-semibold">Insurance Copy</span>
              </div>
              <button class="btn btn-sm btn-primary" (click)="downloadDoc()">
                <i class="bi bi-eye me-1"></i> View
              </button>
            </div>
          </div>

        </div>

        <!-- Reminder Section -->
        <div class="mt-4">
          <h6 class="fw-semibold mb-2">Reminders</h6>

          <div class="d-flex flex-wrap gap-2">
            <span class="badge bg-danger-subtle text-danger px-3 py-2">
              ⚠ FC Renewal Due
            </span>

            <span class="badge bg-warning-subtle text-warning px-3 py-2">
              ⚠ Insurance Renewal
            </span>

            <span class="badge bg-info-subtle text-info px-3 py-2">
              ⚠ Oil Change Required
            </span>

            <span class="badge bg-secondary-subtle text-secondary px-3 py-2">
              ⚠ Tyre Check Required
            </span>
          </div>
        </div>

      </div>

      <!-- RIGHT SIDE (CAROUSEL) -->
      <!-- RIGHT SIDE (CAROUSEL WITH UPLOAD + DELETE UI) -->
      <div class="col-md-6">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-semibold mb-0">Vehicle Images</h6>
        </div>

        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

          <div class="carousel-inner rounded-3 shadow-sm">

            <!-- 🔥 Image Slides -->
            <div class="carousel-item" *ngFor="let img of images; let i = index" [class.active]="i === 0">

              <div class="carousel-wrapper">

                <img [src]="'http://localhost:8080/uploads/' + img" class="img-fluid w-100" alt="Vehicle Image">

                <!-- Overlay -->
                <div class="carousel-overlay">
                  <button class="btn btn-light btn-sm me-2" (click)="viewImage(img)" title="View Image">
                    <i class="bi bi-eye"></i>
                  </button>

                  <button class="btn btn-danger btn-sm" (click)="openDeleteModal()" title="Delete Image">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>

              </div>
            </div>

            <!-- 🔥 Upload Slide (Last Slide) -->
            <div class="carousel-item" [class.active]="images.length === 0">

              <div class="upload-slide text-center p-5">

                <i class="bi bi-cloud-upload fs-1 text-primary"></i>
                <p class="mt-3">Upload New Image</p>

                <input *ngIf="showFileInput" type="file" accept="image/*" class="form-control mb-3"
                  (change)="onImageSelected($event)">

                <button class="btn btn-primary" [disabled]="!selectedImageFile" (click)="uploadImage()" title="Upload Image">
                  Upload
                </button>

              </div>

            </div>

          </div>

          <!-- Controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>

          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>

        </div>

      </div>

    </div>

    <!-- Service Accordion -->
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body">

        <h5 class="fw-semibold mb-3">Vehicle Services & Documents</h5>

        <div class="accordion custom-accordion" id="serviceAccordion">

              <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#rcCollapse">
                <i class="bi bi-file-earmark-text me-2 text-danger"></i>
                Registration Certificate
              </button>
            </h2>
            <div id="rcCollapse" class="accordion-collapse collapse show" data-bs-parent="#serviceAccordion">
             <app-rc></app-rc>
            </div>
          </div>

          <!-- FC -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#fcCollapse">
                <i class="bi bi-file-earmark-text me-2 text-danger"></i>
                FC Certificate
              </button>
            </h2>
            <div id="fcCollapse" class="accordion-collapse collapse show" data-bs-parent="#serviceAccordion">
              <div class="accordion-body">
              <app-fc></app-fc>
              </div>
            </div>
          </div>

          <!-- Insurance -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#insuranceCollapse">
                <i class="bi bi-shield-check me-2 text-warning"></i>
                Insurance
              </button>
            </h2>
            <div id="insuranceCollapse" class="accordion-collapse collapse" data-bs-parent="#serviceAccordion">
              <div class="accordion-body">
               <app-insurance></app-insurance>
              </div>
            </div>
          </div>

          <!-- Oil Service -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#oilCollapse">
                <i class="bi bi-droplet-half me-2 text-info"></i>
                Oil Service
              </button>
            </h2>
            <div id="oilCollapse" class="accordion-collapse collapse" data-bs-parent="#serviceAccordion">
              <div class="accordion-body">
         
<app-oil-service></app-oil-service>
               
              </div>
            </div>
          </div>

          <!-- Tyre Service -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#tyreCollapse">
                <i class="bi bi-circle me-2 text-secondary"></i>
                Tyre Service
              </button>
            </h2>
            <div id="tyreCollapse" class="accordion-collapse collapse" data-bs-parent="#serviceAccordion">
              <div class="accordion-body">
           <app-tyre></app-tyre>
              </div>
            </div>
          </div>


                  <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#pollutionCollapse">
                <i class="bi bi-circle me-2 text-secondary"></i>
                Pollution Certificate
              </button>
            </h2>
            <div id="pollutionCollapse" class="accordion-collapse collapse" data-bs-parent="#serviceAccordion">
              <div class="accordion-body">
           <app-pollution></app-pollution>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>



</div>
