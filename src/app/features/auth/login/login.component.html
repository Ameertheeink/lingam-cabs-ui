<div class="login-wrapper">
  <div class="login-card">

    <div class="text-center mb-4">
      <img src="assets/images/file_transparent_gold.svg" alt="Logo" height="60">
      <h4 class="mt-3 fw-bold">LINGAM CABS</h4>
      <p class="text-muted small">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" formControlName="username" placeholder="Enter username">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
             class="text-danger small mt-1">Username is required</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Enter password">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
             class="text-danger small mt-1">Password is required</div>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger py-2 small">{{ errorMsg }}</div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>

    </form>
  </div>
</div>
